<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashish's Portfolio Chat</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color-scheme: dark;
    }

    body {
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: white;
        overflow: hidden;
    }

    .chat-interface-container {
        height: 95%;
        width: 95%;
        border-radius: 2rem;
        background: radial-gradient(circle at top, rgb(3, 0, 95), rgb(0, 1, 36));
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* Top Bar Header */
    .chat-header {
        padding: 1.5rem 2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.077);
        display: flex;
        align-items: center;
        gap: 1rem;
        width:100%;
        position: relative;
    }

    .avatar {
        width: 45px;
        height: 45px;
        background: linear-gradient(135deg, #0072ff, #00c6ff);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        box-shadow: 0 0 15px rgba(0, 114, 255, 0.4);
    }

    .header-info h2 {
        color: #fff;
        font-size: 1.1rem;
        letter-spacing: 0.5px;
    }

    .header-info p {
        color: #00c6ff;
        font-size: 0.8rem;
    }

    /* Message Stream Window */
    .messages-box {
        flex: 1;
        width:100%;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        position: relaitve;
        mask-image: linear-gradient(to bottom, transparent 5%, black 15%, black 85%, transparent);
    }

    /* Custom Scrollbar for modern look */
    .messages-box::-webkit-scrollbar {
        width: 6px;
    }
    .messages-box::-webkit-scrollbar-track {
        background: transparent;
    }
    .messages-box::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
    }

    /* Chat Bubbles */
    .message {
        max-width: 75%;
        padding: 1rem 1.25rem;
        border-radius: 1.25rem;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #e0e0e0;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* System/Ashish Message (Left Side) */
    .message.system {
        align-self: flex-start;
        background: rgba(255, 255, 255, 0.06);
        border-bottom-left-radius: 0.25rem;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* User Message (Right Side) */
    .message.user {
        align-self: flex-end;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #ffffff;
        border-bottom-right-radius: 0.25rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* Dynamic Streaming Effect Element */
    .cursor {
        display: inline-block;
        width: 3px;
        height: 15px;
        background: #00c6ff;
        margin-left: 2px;
        animation: blink 0.8s infinite;
    }
    @keyframes blink {
        50% { opacity: 0; }
    }

    /* Bottom Input Utility Bar */
    .input-container {
        padding: 1.5rem 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.092);
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 1rem;
        background: rgba(0, 0, 20, 0.4);
        border-bottom-left-radius: 2rem;
        border-bottom-right-radius: 2rem;
    }

    .input-container .input {
        width:100%;
        min-height:3rem;
        max-height: 6rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 1rem;
        border-radius: 1rem;
        color: #fff;
        font-size: 1rem;
        outline: none;
        resize: none;
        transition: all 0.3s ease;
        scrollbar-width: none;
        /*display: flex;
        flex-direction: row;
        align-items: center;
        /*justify-content: center;*/
        line-height: 1.5rem;
        overflow-y: auto;
        word-wrap: break-word;
        position: relative;
    }

    .input-container .input:empty::before{
        content: "Ask about Ashish's experience...";
        color: rgba(255, 255, 255, 0.4);
        position: absolute;
        left: 1rem;
        top: 1rem;
        pointer-events: none;
    }

    .input-container input:focus {
        border-color: #0072ff;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 15px rgba(0, 114, 255, 0.2);
    }

    .input-container button {
        background: linear-gradient(135deg, #0072ff, #00c6ff);
        color: white;
        border: none;
        font-size: 1rem;
        height:3rem;
        width:auto;
        padding: 0 1.75rem;
        border-radius: 1rem;
        font-weight: 600;
        cursor: pointer;
        place-self: end end;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .input-container button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
    }
    
    .input-container button:active {
        transform: translateY(0);
    }
    .hidden{
        display:none;
    }
    .greetings{
        font-size: 3rem;
        font-weight: 700;
        position:absolute;
        top:50%;
        transform: translateY(-50%);
        left:50%;
        transform: translateX(-50%);

    }
    .close-btn{
        justify-self: flex-end;
    }
    .close-btn {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.6); /* Soft color default */
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem;
        border-radius: 50%;
        transition: all 0.2s ease;
        position: absolute;
        right:1rem;
        top:50%;
        transform: translateY(-50%);
    }

/* Glow and change color on hover/focus */
    .close-btn:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
        /*transform: scale(1.05);*/
    }

    
    @media (width<700px) {
        .greetings{
            font-size: 1.5rem;
            font-weight: 400;
        }
    }
</style>
<body>

    <div class="chat-interface-container">
        <div class="chat-header">
            <div class="avatar">A</div>
            <div class="header-info">
                <h2>Ashish AI</h2>
            </div>
            <div class="close-btn" aria-label="Close">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
        </div>

        <div class="messages-box" id="messagesBox">
            <div class="greetings">Ask me Anything !</div>
        </div>

        <div class="input-container">
            <div id="userInput" class= "input" placeholder="Ask about Ashish's experience..." contenteditable="true"></div>
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // Optional quick UI logic mock up to demonstrate adding bubbles dynamically
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const messagesBox = document.getElementById('messagesBox');

        function appendMessage(text, side) {
            if(!text.trim()) return;
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', side);
            msgDiv.innerText = text;
            messagesBox.appendChild(msgDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        async function fetchAnswerAndShow(text){
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 'system');
            
            // Add a glowing text cursor effect to show typing activity
            msgDiv.innerHTML = '<span class="cursor"></span>';
            messagesBox.appendChild(msgDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;

            try {
                // 3. Post data to your Express backend streaming server
                const response = await fetch('http://localhost:8100/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text })
                });

                if (!response.ok) throw new Error("Failed to contact streaming server");

                // 4. Initialize reader to parse raw network chunks
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantResponse = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break; // Network stream closed down gracefully

                    // Decode binary stream data pack into strings
                    const chunkText = decoder.decode(value, { stream: true });
                    assistantResponse += chunkText;

                    // Update UI with incoming text while preserving the trailing cursor animation
                    msgDiv.innerHTML = assistantResponse + '<span class="cursor"></span>';
                    messagesBox.scrollTop = messagesBox.scrollHeight;
                }

                // 5. Remove the typing cursor once the stream successfully finishes
                msgDiv.innerHTML = assistantResponse;

            } catch (err) {
                console.error(err);
                msgDiv.innerText = "Sorry, something went wrong trying to read the stream output.";
            }
        }

        sendBtn.addEventListener('click', async() => {
            if(document.querySelector(".greetings")){
                messagesBox.removeChild(document.querySelector(".greetings"))
            }
            appendMessage(userInput.textContent, 'user');
            let query = userInput.textContent;
            userInput.textContent = '';
            await fetchAnswerAndShow(query);
        });

        userInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                if(document.querySelector(".greetings")){
                    messagesBox.removeChild(document.querySelector(".greetings"))
                }
                appendMessage(userInput.textContent, 'user');
                let query = userInput.textContent;
                userInput.textContent = '';
                await fetchAnswerAndShow(query)
            }
        });
        document.querySelector(".close-btn").addEventListener("click",()=>{
            document.querySelector(".chat-interface-container").classList.add("hidden")
        })
    </script>
</body>
</html>
